name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Quality gates ─────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff pytest pytest-cov pip-audit mypy

      - name: Lint — critical (F821/E9, blocking)
        run: ruff check main.py config/ data/ services/ ui/ tools/ tests/ --select F821,E9

      - name: Lint — extended (non-blocking)
        run: ruff check main.py config/ data/ services/ ui/ tools/ tests/ --select F401,F841,E402
        continue-on-error: true

      - name: Format check (non-blocking)
        run: ruff format --check main.py config/ data/ services/ ui/ tools/ tests/
        continue-on-error: true

      - name: Type check — mypy (non-blocking, baseline phase)
        run: mypy services/ data/ config/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Security audit — pip-audit (non-blocking)
        run: pip-audit || true
        continue-on-error: true

      - name: i18n — missing keys (blocking)
        run: python tools/check_i18n.py --missing-keys

      - name: i18n — hardcoded ratchet (blocking vs baseline)
        run: python tools/check_i18n.py --hardcoded --baseline tools/i18n_baseline.json



  # ── Tests (Windows) ───────────────────────────────────────────
  test:
    needs: quality
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short `
            --cov=services --cov=data --cov=config `
            --cov-report=term-missing `
            --cov-fail-under=68


  # ── Build + Release (v* tag only) ─────────────────────────────
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Verify release version consistency
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python tools/verify_release_version.py

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Build EXE + Installer
        env:
          PYTHONUTF8: "1"
        run: python auto_build.py

      - name: Rename portable exe with version
        shell: pwsh
        run: |
          # Installer was already built from dist/2image.exe by auto_build;
          # the release asset carries the version in its name.
          Move-Item dist/2image.exe "dist/2image-portable-v${{ steps.ver.outputs.version }}.exe" -Force
          Get-ChildItem dist/*.exe, installer/Output/*.exe | Select-Object Name, Length

      - name: Verify bundled font
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/fonts/JetBrainsMono-Regular.ttf")) {
            Write-Error "Bundled font missing after build (tools/fetch_fonts.py should have fetched it)"
            exit 1
          }
          Write-Host "Bundled font present: assets/fonts/JetBrainsMono-Regular.ttf"

      - name: Generate update manifest, checksums + SBOM
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $installer = "installer/Output/2image-setup-v$v.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer missing: $installer"
            exit 1
          }
          # update.json is the in-app updater's only channel; its SHA256
          # and size are computed from the real built installer.
          python tools/generate_update_manifest.py --version $v --tag "v$v" --installer $installer --out dist/update.json
          $Output = @()
          Get-ChildItem dist/*.exe, installer/Output/*.exe, dist/update.json -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            $Output += "$($hash.Hash)  $($_.Name)"
          }
          $Output | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt
          python tools/generate_sbom.py

      - name: Verify release assets exist
        shell: pwsh
        run: |
          # A release must never be created first and assets patched in
          # later — every required file must already be on disk here.
          $required = @(
            "dist/2image-portable-v${{ steps.ver.outputs.version }}.exe",
            "dist/2image_updater.exe",
            "dist/update.json",
            "SHA256SUMS.txt",
            "dist/SBOM.spdx.json",
            "dist/build-metadata.json"
          )
          Get-ChildItem installer/Output/*.exe | ForEach-Object { $required += $_.FullName }
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Error "Release asset missing: $f"
              exit 1
            }
          }
          Write-Host "All release assets present:"; $required

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: 2image-v${{ steps.ver.outputs.version }}-portable
          path: dist/2image-portable-v${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 2image-v${{ steps.ver.outputs.version }}-installer
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Upload checksums + SBOM
        uses: actions/upload-artifact@v4
        with:
          name: 2image-v${{ steps.ver.outputs.version }}-artifacts
          path: |
            SHA256SUMS.txt
            dist/update.json
            dist/SBOM.spdx.json
            dist/build-metadata.json


      - name: Verify release notes
        shell: pwsh
        run: |
          $notes = "release-notes/v${{ steps.ver.outputs.version }}.md"
          if (-not (Test-Path $notes)) {
            Write-Error "Release notes not found: $notes (see release-notes/TEMPLATE.md)"
            exit 1
          }
          Write-Host "Using release notes: $notes"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.ver.outputs.version }}"
          draft: false
          prerelease: false
          body_path: release-notes/v${{ steps.ver.outputs.version }}.md
          files: |
            dist/2image-portable-v${{ steps.ver.outputs.version }}.exe
            installer/Output/*.exe
            dist/update.json
            SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/build-metadata.json

