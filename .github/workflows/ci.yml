name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  # ── 测试（所有 push / PR 均运行）─────────────────────────────
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint — ruff F/E9 (undefined names + syntax errors)
        run: ruff check services/ ui/ config/ data/ tests/ --select F,E9

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── 构建 + 发布（仅 v* tag 触发）───────────────────────────
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # 创建 GitHub Release 所需

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Build EXE + Installer
        run: python auto_build.py

      - name: List build artifacts
        shell: pwsh
        run: |
          Write-Host "=== dist/ ==="
          Get-ChildItem dist/ -ErrorAction SilentlyContinue | Select-Object Name, Length
          Write-Host "=== installer/Output/ ==="
          Get-ChildItem installer/Output/ -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Upload portable EXE (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: text2image-pro-v${{ steps.ver.outputs.version }}-portable
          path: dist/text2image_pro.exe
          if-no-files-found: warn

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: text2image-pro-v${{ steps.ver.outputs.version }}-installer
          path: installer/Output/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.ver.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/text2image_pro.exe
            installer/Output/*.exe
