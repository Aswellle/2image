name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Quality gates ─────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff pytest pytest-cov

      - name: Lint — critical (F821/E9, blocking)
        run: ruff check services/ config/ data/ tests/ --select F821,E9

      - name: Lint — extended (non-blocking)
        run: ruff check services/ config/ data/ tests/ --select F401,F841,E402
        continue-on-error: true

      - name: Format check (non-blocking)
        run: ruff format --check services/ config/ data/ tests/
        continue-on-error: true

  # ── Tests (Windows) ───────────────────────────────────────────
  test:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short `
            --cov=services --cov=data --cov=config `
            --cov-report=term-missing `
            --cov-fail-under=50


  # ── Build + Release (v* tag only) ─────────────────────────────
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Build EXE + Installer
        env:
          PYTHONUTF8: "1"
        run: python auto_build.py

      - name: Generate checksums + SBOM
        shell: pwsh
        run: |
          $Output = @()
          Get-ChildItem dist/*.exe, installer/Output/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            $Output += "$($hash.Hash)  $($_.Name)"
          }
          $Output | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt
          python tools/generate_sbom.py

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: text2image-pro-v${{ steps.ver.outputs.version }}-portable
          path: dist/text2image_pro.exe
          if-no-files-found: warn

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: text2image-pro-v${{ steps.ver.outputs.version }}-installer
          path: installer/Output/*.exe
          if-no-files-found: warn

      - name: Upload checksums + SBOM
        uses: actions/upload-artifact@v4
        with:
          name: text2image-pro-v${{ steps.ver.outputs.version }}-artifacts
          path: |
            SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/build-metadata.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.ver.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/text2image_pro.exe
            installer/Output/*.exe
            SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/build-metadata.json
